# Configuration commune aux trois decks.
#
# Deux modes de rendu :
#
#   quarto render S1-fondamentaux.qmd
#       → fichier HTML UNIQUE, autonome, sans dépendance externe.
#         C'est la version à projeter et à distribuer aux étudiants.
#
#   quarto render S1-fondamentaux.qmd --profile tableau
#       → active le tableau blanc (annotation en direct sur les slides,
#         touche B pour le tableau, C pour le stylo).
#         Produit un HTML + un dossier `*_files/` : NE PAS distribuer,
#         garder pour votre usage en salle.
#
# Le plugin chalkboard est incompatible avec `embed-resources`, d'où
# les deux profils. Voir 01-Slides/README.md.

project:
  type: default
  output-dir: .

format:
  revealjs:
    theme: [default, theme.scss]
    slide-number: c/t
    show-slide-number: all
    transition: none
    width: 1280
    height: 760
    incremental: false
    code-line-numbers: false
    embed-resources: true
    chalkboard: false

execute:
  echo: false
  warning: false

lang: fr
author: "Bilel Sanhaji — Université Paris 8"
date: last-modified
date-format: "D MMMM YYYY"
