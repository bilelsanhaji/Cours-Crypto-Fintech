# Profil « tableau » — pour projeter en salle avec annotation en direct.
#
#   quarto render S1-fondamentaux.qmd --profile tableau
#
# Raccourcis en présentation :
#   B  → tableau blanc plein écran
#   C  → stylo (dessiner par-dessus la slide)
#   DEL→ effacer
#   D  → télécharger les annotations
#
# ⚠️ Ce profil désactive embed-resources : le rendu produit un dossier
#    `*_files/` à côté du HTML. Les deux doivent rester ensemble.
#    Pour la version à distribuer aux étudiants, rendre SANS ce profil.

format:
  revealjs:
    embed-resources: false
    chalkboard:
      theme: whiteboard
      boardmarker-width: 4
